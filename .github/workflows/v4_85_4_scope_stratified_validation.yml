          lines += ["","因子方向、FDR、月區塊Bootstrap：見 04、06、07。","成本壓力配對效果：見 12。","不把兩種區段口徑混合，也不把 H／成本／交易模式重複列視為獨立交易。"]
          (OUT/"13_v4.85.4_執行摘要.txt").write_text("\n".join(lines),encoding="utf-8")
          with zipfile.ZipFile(OUT/"看股最速適_v4.85.4_區段分層因子成本驗證報告.zip","w",
                               compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
