              "model_score_fields":len(SCORES),"market_context_factors":len(MARKET),
              "analysis_unit":"H × 區段口徑 × 成本 × 訊號日期 × 市場",
              "minimum_cross_section_n":5,"bootstrap_replicates":B,"block_months":BLOCKS,
              "full_transaction_key_duplicate_rows":duplicate_rows,
              "paired_cost_daily_scope_cells":len(paired),
              "notes":[
                  "The prior v4.85.1 and v4.85.3 results pooled two distinct 区段口徑 values. This v4.85.4 re-runs all cross-sectional tests separately by scope.",
                  "Only 前10名候選逐檔評估 with included, valid-entry, valid-exit, nonmissing realized net returns are analyzed.",
                  "General and stress costs are analyzed separately; paired differences use scope-specific date-market cells.",
                  "Rank scores are reversed so positive effect means smaller, better numeric rank group outperforms larger rank group.",
                  "Spearman FDR is corrected separately within each H × scope × cost family across 20 stock feature/model score fields.",
                  "Monthly moving-block bootstrap tests temporal stability; it is not a causal test or live deployment evidence."
              ]
          }
          (OUT/"00_v4.85.4_manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")

          lines=[
              "看股最速適 v4.85.4｜區段口徑分層因子與成本驗證",
              "="*88,
              f"來源 ZIP SHA256：{EXPECTED_SHA}",
              f"逐筆資料：{len(df):,}；正式納入有效交易（兩成本合計）：{len(sample):,}",
              f"區段口徑：{SCOPES}",
              "分析單位：H × 區段口徑 × 成本 × 訊號日期 × 市場。",
              "每一個 H／區段／成本族群內，Spearman FDR 對 20 欄分別校正。",
              "高低分位和月區塊Bootstrap均按區段口徑獨立計算。",
