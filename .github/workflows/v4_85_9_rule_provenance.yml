name: SSO v4.85.9 rule provenance audit

on:
  push:
    branches:
      - "audit/v4.84.9.3-rebuild-pipeline"
    paths:
      - ".github/workflows/v4_85_9_rule_provenance.yml"
      - "audit/v4.85.9/REQUEST.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sso-v4-85-9-rule-provenance
  cancel-in-progress: false

jobs:
  inspect-main-archives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: "audit/v4.84.9.3-rebuild-pipeline"
          persist-credentials: true

      - name: Checkout main as read-only evidence source
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_src
          persist-credentials: false

      - name: Inspect historical result archives without modifying source
        run: |
          python - <<'PY'
          import csv, hashlib, io, json, re, zipfile
          from pathlib import Path
          from datetime import datetime, timezone

          src = Path("main_src")
          out = Path("audit_readout/v4.85.9_20261104_rule_provenance")
          out.mkdir(parents=True, exist_ok=True)
          (out / "ZIP成員清冊").mkdir(exist_ok=True)

          targets = [
              "SSO_v2.45_樣本外校準門檻與公司名稱結果.zip",
              "SSO_v2.48.1_樣本外校準門檻與公司名稱結果.zip",
              "SSO_v2.50_日成交量特徵與500日檢查點結果.zip",
              "SSO_v2.51_個股獨立評估_量能消融與配對比較結果.zip",
              "SSO_v2.51_量能消融_停用量能特徵與配對比較結果.zip",
          ]
          pattern = re.compile(
              r"MIN_PROFIT_PROBABILITY|PRIORITY_PROFIT_PROBABILITY|OOS_GATE_|"
              r"eligible|pass_gate|oos_supported|校準方向|歷史同機率|"
              r"獲利資格|合格候選|持有期間|上漲潛力|淨獲利機率|"
              r"樣本外|回看市場日|最低樣本|訊號日|win.rate|net.return",
              re.I
          )
          inventory, excerpts, errors, archives = [], [], [], []

          for name in targets:
              p = src / name
              if not p.is_file():
                  errors.append({"archive": name, "error": "FILE_NOT_FOUND_ON_MAIN"})
                  continue
              raw = p.read_bytes()
              archive_info = {
                  "archive": name, "size_bytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest()
              }
              archives.append(archive_info)
              try:
                  with zipfile.ZipFile(io.BytesIO(raw), "r") as zf:
                      bad = zf.testzip()
                      if bad:
                          errors.append({"archive": name, "error": "ZIP_CRC_FAILED", "member": bad})
                          continue
                      for info in zf.infolist():
                          member = info.filename
                          data = zf.read(member)
                          row = {
                              "archive": name, "member": member,
                              "size_bytes": info.file_size,
                              "compressed_bytes": info.compress_size,
                              "sha256": hashlib.sha256(data).hexdigest(),
                          }
                          inventory.append(row)
                          suffix = Path(member).suffix.lower()
                          text = None
                          if suffix in {".txt", ".md", ".json", ".py", ".csv", ".ipynb", ".html"}:
                              try:
                                  text = data.decode("utf-8-sig")
                              except UnicodeDecodeError:
                                  text = data.decode("utf-8", errors="replace")
                          if text is None:
                              continue

                          if suffix == ".ipynb":
                              try:
                                  nb = json.loads(text)
                                  for ci, cell in enumerate(nb.get("cells", [])):
                                      source = cell.get("source", "")
                                      if isinstance(source, list):
                                          source = "".join(source)
                                      for li, line in enumerate(source.splitlines(), 1):
                                          if pattern.search(line):
                                              excerpts.append({
                                                  "archive": name, "member": member,
                                                  "cell": ci, "line": li,
                                                  "text": line[:1200]
                                              })
                              except Exception as exc:
                                  errors.append({"archive": name, "member": member, "error": "NOTEBOOK_PARSE_ERROR: "+str(exc)})
                          else:
                              lines = text.splitlines()
                              matches = [i for i, line in enumerate(lines) if pattern.search(line)]
                              if suffix == ".csv":
                                  # Capture header and only relevant rows; retain line numbers.
                                  selected = set(range(min(8, len(lines))))
                                  for i in matches[:300]:
                                      selected.update(range(max(0, i-1), min(len(lines), i+2)))
                              else:
                                  selected = set()
                                  for i in matches[:300]:
                                      selected.update(range(max(0, i-2), min(len(lines), i+3)))
                                  if not matches:
                                      selected.update(range(min(60, len(lines))))
                              if selected:
                                  for i in sorted(selected):
                                      excerpts.append({
                                          "archive": name, "member": member,
                                          "cell": "", "line": i+1,
                                          "text": lines[i][:1200]
                                      })

                          # Store text members up to 2 MB individually; no executable code is run.
                          if len(data) <= 2_000_000 and suffix in {".txt", ".md", ".json", ".py", ".ipynb"}:
                              archive_dir = out / "ZIP成員清冊" / name.replace(".zip", "")
                              archive_dir.mkdir(parents=True, exist_ok=True)
                              member_base = Path(member).name
                              member_hash = hashlib.sha1(member.encode("utf-8")).hexdigest()[:10]
                              dest = archive_dir / (Path(member_base).stem + "__" + member_hash + Path(member_base).suffix)
                              dest.write_bytes(data)

              except Exception as exc:
                  errors.append({"archive": name, "error": "ZIP_READ_ERROR: "+repr(exc)})

          def write_csv(path, rows, fields):
              with path.open("w", encoding="utf-8-sig", newline="") as f:
                  w = csv.DictWriter(f, fieldnames=fields)
                  w.writeheader()
                  w.writerows(rows)

          write_csv(out / "01_原始結果ZIP清冊.csv", archives, ["archive","size_bytes","sha256"])
          write_csv(out / "02_ZIP成員清冊.csv", inventory, ["archive","member","size_bytes","compressed_bytes","sha256"])
          write_csv(out / "03_規則與結果命中摘錄.csv", excerpts, ["archive","member","cell","line","text"])
          write_csv(out / "04_讀取錯誤.csv", errors, ["archive","member","error"])

          with (out / "00_證據範圍與限制.txt").open("w", encoding="utf-8") as f:
              f.write("SSO v4.85.9｜正式模型規則來源追查（第一輪：main 歷史結果 ZIP）\n")
              f.write("執行時間 UTC："+datetime.now(timezone.utc).isoformat()+"\n")
              f.write("讀取分支：main（checkout only；未修改）\n")
              f.write("寫入分支：audit/v4.84.9.3-rebuild-pipeline\n")
              f.write("本輪只讀取五個歷史結果 ZIP；不執行 Notebook／Python；不讀逐筆行情 CSV.GZ；不訓練模型。\n")
              f.write("本輪 ZIP 不包含 v2.40 原始正式策略封存檔；無法僅憑結果 ZIP 證明正式模型原碼。\n")
              f.write("清冊與摘錄只用來確認封存內容、結果欄位、版本說明及是否含程式碼，不能把研究報告敘述當成執行證據。\n")
              f.write(f"成功讀取 ZIP 數：{len(archives)}；成員數：{len(inventory)}；文字命中摘錄：{len(excerpts)}；錯誤：{len(errors)}\n")
              f.write("\nZIP SHA256：\n")
              for a in archives:
                  f.write(f"{a['archive']} | {a['size_bytes']} | {a['sha256']}\n")
          print("SSO_V4_85_9_ARCHIVE_PROVENANCE_INSPECTION_COMPLETED")
          print("ARCHIVES=" + str(len(archives)))
          print("MEMBERS=" + str(len(inventory)))
          print("EXCERPTS=" + str(len(excerpts)))
          print("ERRORS=" + str(len(errors)))
          PY

      - name: Commit evidence inventory to isolated audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit_readout/v4.85.9_20261104_rule_provenance/
          if git diff --cached --quiet; then
            echo "No new provenance inventory."
          else
            git commit -m "Add SSO v4.85.9 historical archive provenance inventory"
            git push origin "HEAD:refs/heads/audit/v4.84.9.3-rebuild-pipeline"
          fi
