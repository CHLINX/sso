name: Audit SSO calibration direction result rows
on:
  push:
    branches:
      - "audit/v4.85-calibration-evidence-20261103"
    paths:
      - ".github/workflows/audit_v485_calibration_rows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-calibration-rows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Scan calibration evidence rows with progress
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, gzip, hashlib, io, json, math, statistics, time, urllib.parse, urllib.request, zipfile
          from collections import Counter, defaultdict
          from pathlib import Path

          REPO = "CHLINX/sso"
          ARCHIVES = [
              ("v2.48.1", "SSO_v2.48.1_樣本外校準門檻與公司名稱結果.zip", 21010200, "a100ed331990bb82940adcb71a1bbb7cc78acc5e"),
              ("v2.50", "SSO_v2.50_日成交量特徵與500日檢查點結果.zip", 21654521, "2ae5b146d767c5f54310ca7d53d986f56ae1c56f"),
              ("v2.51_individual", "SSO_v2.51_個股獨立評估_量能消融與配對比較結果.zip", 23606997, "d5196aeed4bffe6386dd456fce46be9338c60a51"),
              ("v2.51_ablation", "SSO_v2.51_量能消融_停用量能特徵與配對比較結果.zip", 21011289, "103335910c03a9a30099715b4362fed5672d0cd3"),
          ]
          TARGETS = {
              "latest": "最新全市場候選持續評估",
              "history": "歷史樣本外每日10檔候選",
              "cal_summary": "獲利機率校準檢驗總結",
              "cal_daily": "獲利機率校準逐訊號日",
              "gate": "樣本外機率區間門檻診斷",
          }
          ROOT = Path("/tmp/sso_calibration_rows")
          ROOT.mkdir(parents=True, exist_ok=True)

          def git_blob_sha(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\\0" + data).hexdigest()

          def num(x):
              try:
                  if x is None or str(x).strip() == "":
                      return None
                  v = float(str(x).replace("%", "").replace(",", ""))
                  return v if math.isfinite(v) else None
              except Exception:
                  return None

          def boolean(x):
              if x is None or str(x).strip() == "":
                  return None
              s = str(x).strip().lower()
              if s in ("true", "1", "1.0", "yes", "y", "是", "通過", "pass"):
                  return True
              if s in ("false", "0", "0.0", "no", "n", "否", "未通過", "fail"):
                  return False
              return None

          def profile(row):
              return (
                  row.get("持有期間H", ""),
                  round(num(row.get("機率校準斜率")) or 0.0, 12),
                  round(num(row.get("機率校準截距")) or 0.0, 12),
                  int(num(row.get("模型訓練樣本數")) or 0),
                  int(num(row.get("模型校準樣本數")) or 0),
                  boolean(row.get("分類模型已收斂")),
                  boolean(row.get("機率校準已收斂")),
              )

          def count_bool(counter, key, value):
              if value is True: counter[key + "_true"] += 1
              elif value is False: counter[key + "_false"] += 1
              else: counter[key + "_missing"] += 1

          def scan_csv(zf, info, label, kind):
              raw = zf.open(info.filename)
              if info.filename.lower().endswith(".gz"):
                  raw = gzip.GzipFile(fileobj=raw)
              text = io.TextIOWrapper(raw, encoding="utf-8-sig", errors="replace", newline="")
              reader = csv.DictReader(text)
              start = time.time()
              stats = defaultdict(Counter)
              signal_profiles = defaultdict(set)
              all_profiles = set()
              slopes = []
              statuses = Counter()
              gate_latest = {}
              cal_rows = []
              row_count = 0
              last_report = start
              try:
                  for row in reader:
                      row_count += 1
                      h = str(row.get("持有期間H", "")).strip()
                      if not h:
                          continue
                      c = stats[h]
                      if kind in ("latest", "history"):
                          c["rows"] += 1
                          c["qualified_true"] += boolean(row.get("符合獲利候選條件")) is True
                          c["oos_gate_true"] += boolean(row.get("歷史同機率區間通過門檻")) is True
                          c["oos_gate_false"] += boolean(row.get("歷史同機率區間通過門檻")) is False
                          count_bool(c, "support", boolean(row.get("校準方向受支持")))
                          count_bool(c, "class_fit", boolean(row.get("分類模型已收斂")))
                          count_bool(c, "cal_fit", boolean(row.get("機率校準已收斂")))
                          slope = num(row.get("機率校準斜率"))
                          if slope is not None:
                              slopes.append(slope)
                              if slope > 0: c["slope_positive"] += 1
                              elif slope < 0: c["slope_negative"] += 1
                              else: c["slope_zero"] += 1
                          cf = boolean(row.get("分類模型已收斂"))
                          cal = boolean(row.get("機率校準已收斂"))
                          flag = boolean(row.get("校準方向受支持"))
                          if cf is not None and cal is not None and slope is not None and flag is not None:
                              expected = bool(cf and cal and slope > 0)
                              c["formula_match"] += flag == expected
                              c["formula_mismatch"] += flag != expected
                          status = str(row.get("候選狀態", "")).strip()
                          if status: statuses[(h, status)] += 1
                          sigdate = str(row.get("訊號日期", "")).strip()
                          if kind == "history" and sigdate:
                              signal_profiles[(h, sigdate)].add(profile(row))
                              all_profiles.add(profile(row))
                      elif kind == "cal_summary":
                          cal_rows.append({
                              "h": h,
                              "bin": str(row.get("估計淨獲利機率區間", "")),
                              "n": int(num(row.get("有效樣本數")) or 0),
                              "wins": int(num(row.get("淨獲利筆數")) or 0),
                              "pred_p": num(row.get("平均估計淨獲利機率")),
                              "actual_p": num(row.get("實際淨獲利率")),
                              "mean_pred": num(row.get("平均預測淨報酬")),
                              "mean_net": num(row.get("平均實際淨報酬")),
                              "days": int(num(row.get("有效訊號日數")) or 0),
                          })
                      elif kind == "cal_daily":
                          cal_rows.append({
                              "h": h,
                              "bin": str(row.get("估計淨獲利機率區間", "")),
                              "date": str(row.get("訊號日期", "")),
                              "idx": int(num(row.get("訊號全市場日序")) or -1),
                              "n": int(num(row.get("有效樣本數")) or 0),
                              "wins": int(num(row.get("淨獲利筆數")) or 0),
                              "pred_p": num(row.get("平均估計淨獲利機率")),
                              "actual_p": num(row.get("實際淨獲利率")),
                              "mean_net": num(row.get("平均實際淨報酬")),
                          })
                      elif kind == "gate":
                          idx = int(num(row.get("篩選基準全市場日序")) or -1)
                          key = (h, str(row.get("機率區間", "")))
                          if key not in gate_latest or idx > gate_latest[key]["idx"]:
                              gate_latest[key] = {
                                  "idx": idx,
                                  "date": row.get("篩選基準訊號日期", ""),
                                  "n": int(num(row.get("歷史同機率區間樣本數")) or 0),
                                  "days": int(num(row.get("歷史同機率區間訊號日數")) or 0),
                                  "weighted_win": num(row.get("歷史同區間實際淨獲利率_成交加權")),
                                  "daily_win": num(row.get("歷史同區間實際淨獲利率_逐日平均")),
                                  "weighted_net": num(row.get("歷史同區間平均實際淨報酬_成交加權")),
                                  "daily_net": num(row.get("歷史同區間平均實際淨報酬_逐日平均")),
                                  "pass": boolean(row.get("歷史同機率區間通過門檻")),
                                  "reason": row.get("未通過原因", ""),
                              }
                      if row_count % 100000 == 0 or time.time() - last_report >= 8:
                          elapsed = max(time.time() - start, 1e-6)
                          byte_pos = raw.tell()
                          print(f"SCAN {label}/{kind}: rows={row_count:,}; uncompressed_read={byte_pos:,}/{info.file_size:,}; speed={row_count/elapsed:,.0f} rows/s; progress={min(byte_pos/max(info.file_size,1),1):.1%}", flush=True)
                          last_report = time.time()
              finally:
                  text.close()

              elapsed = max(time.time() - start, 1e-6)
              print(f"SCAN_DONE {label}/{kind}: rows={row_count:,}; uncompressed_read={info.file_size:,}; elapsed={elapsed:.1f}s; speed={row_count/elapsed:,.0f} rows/s", flush=True)

              if kind in ("latest", "history"):
                  result = {}
                  for h, c in sorted(stats.items()):
                      result[h] = dict(c)
                      result[h]["slope_min"] = min(slopes) if slopes else None
                      result[h]["slope_max"] = max(slopes) if slopes else None
                  day_summary = {}
                  for (h, d), ps in signal_profiles.items():
                      day_summary.setdefault(h, {"days":0,"support_true_days":0,"support_false_days":0,"multi_profile_days":0})
                      day_summary[h]["days"] += 1
                      if len(ps) > 1: day_summary[h]["multi_profile_days"] += 1
                      for p in ps:
                          support = bool(p[5] is True and p[6] is True and p[1] > 0)
                          if support: day_summary[h]["support_true_days"] += 1
                          else: day_summary[h]["support_false_days"] += 1
                  return {"by_h":result, "status_top": {f"{h}|{s}":n for (h,s),n in statuses.most_common(20)},
                          "history_model_days":day_summary, "unique_model_profiles":len(all_profiles)}
              if kind == "cal_summary":
                  return cal_rows
              if kind == "cal_daily":
                  groups = defaultdict(lambda: {"n":0,"wins":0,"sum_pred_p":0.0,"sum_net":0.0,"days":set(),"max_idx":-1,"records":[]})
                  for r in cal_rows:
                      g = groups[(r["h"],r["bin"])]
                      n = r["n"]
                      g["n"] += n
                      g["wins"] += r["wins"]
                      if r["pred_p"] is not None: g["sum_pred_p"] += r["pred_p"]*n
                      if r["mean_net"] is not None: g["sum_net"] += r["mean_net"]*n
                      if r["date"]: g["days"].add(r["date"])
                      g["max_idx"] = max(g["max_idx"],r["idx"])
                      g["records"].append(r)
                  out = []
                  for (h,b),g in sorted(groups.items()):
                      out.append({"h":h,"bin":b,"n":g["n"],"wins":g["wins"],
                                  "actual_win":g["wins"]/g["n"] if g["n"] else None,
                                  "mean_pred_p":g["sum_pred_p"]/g["n"] if g["n"] else None,
                                  "mean_actual_net":g["sum_net"]/g["n"] if g["n"] else None,
                                  "signal_days":len(g["days"]),"last_idx":g["max_idx"]})
                  return out
              if kind == "gate":
                  return gate_latest

          total_start = time.time()
          for archive_i, (label, filename, expected_size, expected_blob) in enumerate(ARCHIVES,1):
              print(f"\\n========== ARCHIVE {archive_i}/{len(ARCHIVES)} {label} ==========", flush=True)
              url = f"https://raw.githubusercontent.com/{REPO}/main/{urllib.parse.quote(filename)}"
              request = urllib.request.Request(url, headers={"User-Agent":"SSO-read-only-calibration-row-audit"})
              target = ROOT / filename
              digest = hashlib.sha256()
              size = 0
              t0 = time.time()
              with urllib.request.urlopen(request, timeout=120) as response, target.open("wb") as out:
                  while True:
                      chunk = response.read(1024*1024)
                      if not chunk: break
                      out.write(chunk); digest.update(chunk); size += len(chunk)
                      elapsed = max(time.time()-t0,1e-6)
                      print(f"DOWNLOAD {label}: {size:,}/{expected_size:,} bytes ({size/expected_size:.1%}); {size/elapsed/1024/1024:.1f} MiB/s", flush=True)
              data = target.read_bytes()
              actual_blob = git_blob_sha(data)
              if size != expected_size or actual_blob != expected_blob:
                  raise RuntimeError(f"Archive integrity mismatch: {label} size={size} blob={actual_blob}")
              print(f"INTEGRITY_OK {label}: bytes={size:,}; git_blob={actual_blob}; sha256={digest.hexdigest()}", flush=True)
              with zipfile.ZipFile(io.BytesIO(data)) as zf:
                  bad = zf.testzip()
                  if bad: raise RuntimeError(f"CRC failure {label}: {bad}")
                  infos = {i.filename:i for i in zf.infolist()}
                  for kind, prefix in TARGETS.items():
                      matches = [n for n in infos if n.rsplit("/",1)[-1].startswith(prefix) and n.lower().endswith(".csv")]
                      if not matches:
                          print(f"TARGET_MISSING {label}/{kind} prefix={prefix}", flush=True)
                          continue
                      name = sorted(matches)[0]
                      print(f"READ {label}/{kind}: {name}; uncompressed_bytes={infos[name].file_size:,}", flush=True)
                      result = scan_csv(zf, infos[name], label, kind)
                      if kind in ("latest","history"):
                          print("MODEL_STATUS_SUMMARY=" + json.dumps({"archive":label,"kind":kind,**result},ensure_ascii=False), flush=True)
                      elif kind == "cal_summary":
                          print("CALIBRATION_BIN_SUMMARY=" + json.dumps({"archive":label,"rows":result},ensure_ascii=False), flush=True)
                      elif kind == "cal_daily":
                          print("CALIBRATION_DAILY_AGG=" + json.dumps({"archive":label,"groups":result},ensure_ascii=False), flush=True)
                      elif kind == "gate":
                          slim = {f"{h}|{b}":v for (h,b),v in result.items()}
                          print("LATEST_OOS_GATE=" + json.dumps({"archive":label,"gates":slim},ensure_ascii=False), flush=True)
              print(f"ARCHIVE_COMPLETE {label}", flush=True)

          print(f"ALL_CALIBRATION_RESULT_SCANS_COMPLETE elapsed_seconds={time.time()-total_start:.1f}", flush=True)
          PY
