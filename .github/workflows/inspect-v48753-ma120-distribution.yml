name: SSO v4.87.5.3 MA120 coverage distribution

on:
  push:
    branches:
      - "audit/v48753-zipread-20261105-233056"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize one-sided MA120 rows by date and symbol
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, io, urllib.request, zipfile
          from collections import Counter, defaultdict

          url = "https://raw.githubusercontent.com/CHLINX/sso/audit/v48753-ma120-20261105_233056/audit/20261105_v48753_ma120/SSO_v4.87.5.3_MA120_diagnostic_20261105_233056.zip"
          expected = "38ead25fc857961bb0ee3087464ce7d1adb761479b953f948a378b5e015cf5ef"
          req = urllib.request.Request(url, headers={"User-Agent": "SSO-MA120-coverage-distribution"})
          data = urllib.request.urlopen(req, timeout=40).read()
          if hashlib.sha256(data).hexdigest() != expected:
              raise RuntimeError("ZIP SHA256 mismatch")

          def missing(v):
              return v is None or str(v).strip().lower() in ("", "nan", "none", "null", "<na>")

          with zipfile.ZipFile(io.BytesIO(data)) as zf:
              name = next(n for n in zf.namelist() if n.endswith("01_歷史唯一訊號鍵完整比對.csv"))
              rows = list(csv.DictReader(io.StringIO(zf.read(name).decode("utf-8-sig"))))
          one = [r for r in rows if not missing(r.get("ma120_history")) and missing(r.get("ma120_formula_segment"))]
          reverse = [r for r in rows if missing(r.get("ma120_history")) and not missing(r.get("ma120_formula_segment"))]
          print("HISTORY_VALID_FORMULA_MISSING:", len(one))
          print("HISTORY_MISSING_FORMULA_VALID:", len(reverse))
          print("ONE_SIDED_DATE_RANGE:", min(r["date"] for r in one), "to", max(r["date"] for r in one))
          print("ONE_SIDED_BY_YEAR_MONTH:")
          c = Counter(r["date"][:7] for r in one)
          for k, v in sorted(c.items()):
              print(k, v)
          print("ONE_SIDED_TOP_SYMBOLS:")
          sc = Counter((r["market"], r["symbol"]) for r in one)
          for (m,s),v in sc.most_common(40):
              dates = [r["date"] for r in one if r["market"] == m and r["symbol"] == s]
              print(m, s, v, min(dates), max(dates))
          print("ONE_SIDED_SAMPLE_LAST_25:")
          for r in one[-25:]:
              print(r["market"], r["symbol"], r["date"], "seg", r["segment"], "stored", r["ma120_stored"])
          PY
