name: SSO v2.57-v2.61 read-only result extraction

on:
  push:
    branches:
      - "audit/v257-read-only-extract-20261108"

permissions:
  contents: read

jobs:
  inspect-existing-zips:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify and extract existing SSO audit archives
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import io
          import urllib.error
          import urllib.request
          import zipfile
          from pathlib import PurePosixPath
          from urllib.parse import quote

          base = "https://raw.githubusercontent.com/CHLINX/sso/main/"
          archives = [
              {
                  "version": "v2.57",
                  "name": "SSO_v2.57_條件式交易模式回溯核驗結果_20261029_062605.zip",
                  "size": 12721426,
                  "sha256": "9693fbfc18eb923649fbd4643d5e4da0375a18c69c50f9650cd3bf2bbfee49b1",
                  "csvs": [
                      "v2.57_條件式回溯績效彙總.csv",
                      "v2.57_條件旗標一致性.csv",
                      "v2.57_回報來源配對稽核.csv",
                      "v2.57_對照鍵值唯一性異常.csv",
                  ],
              },
              {
                  "version": "v2.58",
                  "name": "SSO_v2.58_候選排除門檻拆解結果_20261029_075004.zip",
                  "size": 2229698,
                  "sha256": "3fd718631cb6fb2de312011733eba3c31236ec35bc594393d8834694fd1a3644",
                  "csvs": [
                      "v2.58_候選門檻反事實情境彙總.csv",
                      "v2.58_原始旗標與單項門檻盤點.csv",
                      "v2.58_兩種條件模式欄位一致性.csv",
                      "v2.58_候選狀態排除原因績效.csv",
                      "v2.58_基準前10名績效.csv",
                  ],
              },
              {
                  "version": "v2.59",
                  "name": "SSO_v2.59_時間切分穩定性診斷結果_20261029_080204.zip",
                  "size": 225716,
                  "sha256": "9eb06a7c67601cf8e9942dce18f7b8915ec5d0b2839be7af9b29fd5f7bf487ba",
                  "csvs": [
                      "v2.59_時間切分情境彙總.csv",
                      "v2.59_時間切分候選旗標盤點.csv",
                      "v2.59_各時期候選狀態績效.csv",
                      "v2.59_時間切片界線.csv",
                  ],
              },
              {
                  "version": "v2.60",
                  "name": "SSO_v2.60_訊號日層級穩定性診斷結果_20261029_082147.zip",
                  "size": 589833,
                  "sha256": "f8b53d0748c223d1b7ebf43e45edc860e4dfba1cf28bdd58e1bee53aff051f9e",
                  "csvs": [
                      "v2.60_H3_H5_H10重點彙整.csv",
                      "v2.60_資料完整性與配對檢查.csv",
                      "v2.60_時間切片界線.csv",
                  ],
              },
              {
                  "version": "v2.61",
                  "name": "SSO_v2.61_訊號日極端日穩健性診斷結果_20261029_084332.zip",
                  "size": 29432,
                  "sha256": "a9f777cc9c862ed92ab66db2f65955477520b817b80990890870251b1cfbc385",
                  "csvs": [
                      "v2.61_訊號日穩健性摘要.csv",
                      "v2.61_一般成本與壓力成本比較.csv",
                      "v2.61_資料完整性檢查.csv",
                  ],
              },
          ]

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          def emit_csv(zf, wanted):
              members = [n for n in zf.namelist() if PurePosixPath(n).name == wanted]
              if not members:
                  print(f"CSV_NOT_FOUND: {wanted}")
                  return
              raw = zf.read(members[0])
              rows = list(csv.DictReader(io.StringIO(raw.decode("utf-8-sig", errors="replace"))))
              print(f"CSV: {wanted} | bytes={len(raw)} | rows={len(rows)} | sha256={sha256(raw)}")
              print(f"TABLE_BEGIN: {wanted}")
              for row in rows[:100]:
                  print(" | ".join(f"{k}={v}" for k, v in row.items()))
              if len(rows) > 100:
                  print(f"TABLE_TRUNCATED: {len(rows)-100} additional rows")
              print(f"TABLE_END: {wanted}")

          found = []
          for item in archives:
              url = base + quote(item["name"], safe="")
              req = urllib.request.Request(url, headers={"User-Agent": "SSO-read-only-result-audit"})
              try:
                  with urllib.request.urlopen(req, timeout=90) as response:
                      raw = response.read()
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      print(f"ARCHIVE_NOT_ON_GITHUB_MAIN: {item['name']} | HTTP 404")
                      continue
                  raise

              actual_sha = sha256(raw)
              print("\\n" + "=" * 105)
              print(f"ARCHIVE: {item['version']} | {item['name']}")
              print(f"BYTES: {len(raw)} | EXPECTED: {item['size']}")
              print(f"SHA256: {actual_sha} | EXPECTED: {item['sha256']}")
              if len(raw) != item["size"] or actual_sha != item["sha256"]:
                  raise RuntimeError(f"{item['version']} archive size/SHA256 mismatch")
              with zipfile.ZipFile(io.BytesIO(raw), "r") as zf:
                  bad = zf.testzip()
                  if bad is not None:
                      raise RuntimeError(f"{item['version']} ZIP CRC failure: {bad}")
                  print(f"ZIP_TEST: PASS | MEMBERS: {len(zf.namelist())}")
                  reports = [n for n in zf.namelist()
                             if PurePosixPath(n).suffix.lower() == ".txt"
                             and PurePosixPath(n).name.startswith(item["version"])]
                  for name in reports:
                      txt = zf.read(name).decode("utf-8-sig", errors="replace")
                      print(f"REPORT_BEGIN: {name}")
                      print(txt[:16000])
                      if len(txt) > 16000:
                          print(f"REPORT_TRUNCATED_CHARS: {len(txt)-16000}")
                      print(f"REPORT_END: {name}")
                  for csv_name in item["csvs"]:
                      emit_csv(zf, csv_name)
              found.append(item["version"])

          print("\\n" + "=" * 105)
          print("ARCHIVES_VERIFIED:", ",".join(found))
          if "v2.57" not in found or "v2.58" not in found or "v2.60" not in found:
              raise RuntimeError("Required v2.57/v2.58/v2.60 archive missing from GitHub main")
          PY
