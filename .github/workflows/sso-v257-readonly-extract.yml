name: SSO v2.57 read-only result extraction

on:
  push:
    branches:
      - "audit/v257-read-only-extract-20261108"

permissions:
  contents: read

jobs:
  inspect-existing-zips:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download available existing v2.57 result archives
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import io
          import urllib.error
          import urllib.request
          import zipfile
          from pathlib import PurePosixPath
          from urllib.parse import quote

          base = "https://raw.githubusercontent.com/CHLINX/sso/main/"
          names = [
              "SSO_v2.57_條件式交易模式回溯核驗結果_20261029_061311.zip",
              "SSO_v2.57_條件式交易模式回溯核驗結果_20261029_061851.zip",
              "SSO_v2.57_條件式交易模式回溯核驗結果_20261029_062309.zip",
              "SSO_v2.57_條件式交易模式回溯核驗結果_20261029_062605.zip",
          ]
          expected_sha = {
              "SSO_v2.57_條件式交易模式回溯核驗結果_20261029_062605.zip":
              "9693fbfc18eb923649fbd4643d5e4da0375a18c69c50f9650cd3bf2bbfee49b1"
          }

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          def read_csv(zf, filename):
              matches = [n for n in zf.namelist() if PurePosixPath(n).name == filename]
              if not matches:
                  print(f"CSV_NOT_FOUND: {filename}")
                  return []
              raw = zf.read(matches[0])
              rows = list(csv.DictReader(io.StringIO(raw.decode("utf-8-sig", errors="replace"))))
              print(f"CSV: {filename} | bytes={len(raw)} | rows={len(rows)} | sha256={sha256(raw)}")
              return rows

          archives = []
          for name in names:
              url = base + quote(name, safe="")
              req = urllib.request.Request(url, headers={"User-Agent": "SSO-v2.57-read-only-audit"})
              try:
                  with urllib.request.urlopen(req, timeout=90) as response:
                      raw = response.read()
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      print(f"ARCHIVE_NOT_ON_GITHUB_MAIN: {name} | HTTP 404 | skipped")
                      continue
                  raise

              actual_sha = sha256(raw)
              print("\\n" + "=" * 100)
              print(f"ARCHIVE: {name}")
              print(f"BYTES: {len(raw)}")
              print(f"SHA256: {actual_sha}")
              expected = expected_sha.get(name)
              if expected and actual_sha != expected:
                  raise RuntimeError(f"ZIP_SHA256_MISMATCH: expected={expected} actual={actual_sha}")

              with zipfile.ZipFile(io.BytesIO(raw), "r") as zf:
                  bad = zf.testzip()
                  if bad is not None:
                      raise RuntimeError(f"ZIP_TEST_FAILED: {bad}")
                  members = zf.namelist()
                  print(f"ZIP_TEST: PASS | MEMBERS: {len(members)}")
                  for item in members:
                      print(f"MEMBER: {item} | {zf.getinfo(item).file_size}")

                  report_matches = [n for n in members if PurePosixPath(n).name == "SSO_v2.57_條件式交易模式回溯核驗報告.txt"]
                  if report_matches:
                      report_raw = zf.read(report_matches[0])
                      print("REPORT_BEGIN")
                      print(report_raw.decode("utf-8-sig", errors="replace"))
                      print("REPORT_END")
                  else:
                      report_raw = b""
                      print("REPORT_MISSING")

                  for csv_name in [
                      "v2.57_條件式回溯績效彙總.csv",
                      "v2.57_條件旗標一致性.csv",
                      "v2.57_回報來源配對稽核.csv",
                      "v2.57_對照鍵值唯一性異常.csv",
                  ]:
                      rows = read_csv(zf, csv_name)
                      print(f"TABLE_BEGIN: {csv_name}")
                      for row in rows[:80]:
                          print(" | ".join(f"{k}={v}" for k, v in row.items()))
                      if len(rows) > 80:
                          print(f"TABLE_TRUNCATED: {len(rows)-80} rows")
                      print(f"TABLE_END: {csv_name}")

                  detail_rows = read_csv(zf, "v2.57_條件式逐筆重建結果.csv")
                  if detail_rows:
                      groups = {}
                      for row in detail_rows:
                          key = (row.get("持有期間H",""), row.get("成本情境",""), row.get("交易模式",""), row.get("區段口徑",""))
                          g = groups.setdefault(key, {"rows":0,"selected":0,"matched_net":0,"original_net":0})
                          g["rows"] += 1
                          selected = str(row.get("條件旗標達成","")).strip().lower() in ("true","1","yes","y")
                          if selected:
                              g["selected"] += 1
                              if str(row.get("實際淨報酬","")).strip():
                                  g["original_net"] += 1
                              if str(row.get("重建可用淨報酬","")).strip():
                                  g["matched_net"] += 1
                      print("ROW_LEVEL_REAGG_BEGIN")
                      for key in sorted(groups):
                          print(f"{key} | {groups[key]}")
                      print("ROW_LEVEL_REAGG_END")

                  archives.append({"name": name, "zip_sha": actual_sha,
                                   "report_sha": sha256(report_raw) if report_raw else "",
                                   "members": len(members)})

          print("\\n" + "=" * 100)
          print("CROSS_ARCHIVE_COMPARISON")
          for row in archives:
              print(row)
          print("AVAILABLE_ARCHIVES:", len(archives))
          print("ZIP_SHA_VARIANTS:", len({x["zip_sha"] for x in archives}))
          print("REPORT_SHA_VARIANTS:", len({x["report_sha"] for x in archives}))
          if not archives:
              raise RuntimeError("NO_ARCHIVE_AVAILABLE_ON_GITHUB_MAIN")
          PY
