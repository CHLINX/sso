name: Audit SSO strategy lineage ZIPs
on:
  push:
    branches:
      - audit/v475-v240-source-review-20261102
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and inspect selected strategy archives
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, json, os, sys, time, urllib.request, zipfile
          from pathlib import Path

          files = [
            ("SSO_v2.45_樣本外校準門檻與公司名稱結果.zip", 20731287),
            ("SSO_v2.51_個股獨立評估_量能消融與配對比較結果.zip", 23606997),
            ("SSO_v2.56_實際淨報酬與分層核算結果_20261029_055725.zip", 17713),
            ("SSO_v2.57_條件式交易模式回溯核驗結果_20261029_062605.zip", 12721426),
            ("SSO_v2.58_候選排除門檻拆解結果_20261029_075004.zip", 2229698),
            ("SSO_v2.59_時間切分穩定性診斷結果_20261029_080204.zip", 225716),
            ("SSO_v2.60_訊號日層級穩定性診斷結果_20261029_082147.zip", 589833),
            ("SSO_v2.61_訊號日極端日穩健性診斷結果_20261029_084332.zip", 29432),
            ("SSO_v2.62_前瞻影子驗證規格封存結果_20261029_165713.zip", 9039),
          ]
          base = "https://raw.githubusercontent.com/CHLINX/sso/main/"
          total = sum(x[1] for x in files)
          done = 0
          print("SSO strategy lineage audit; source=CHLINX/sso@main; branch is read-only; downloading selected public ZIPs.")
          print(f"Archives={len(files)}; expected_bytes={total:,}")
          for name, expected in files:
              url = base + urllib.parse.quote(name)
              req = urllib.request.Request(url, headers={"User-Agent":"SSO-archive-audit/1.0"})
              t0 = time.time()
              with urllib.request.urlopen(req, timeout=90) as resp:
                  data = resp.read()
              done += len(data)
              print(f"\n=== ARCHIVE {name} ===")
              print(f"downloaded_bytes={len(data):,}; repository_listed_bytes={expected:,}; size_match={len(data)==expected}; elapsed={time.time()-t0:.1f}s; cumulative={done:,}/{total:,}")
              if not zipfile.is_zipfile(io.BytesIO(data)):
                  print("ERROR: downloaded payload is not a ZIP")
                  continue
              z = zipfile.ZipFile(io.BytesIO(data))
              infos = [i for i in z.infolist() if not i.is_dir()]
              print(f"members={len(infos)}; uncompressed_bytes={sum(i.file_size for i in infos):,}")
              for i in infos:
                  print(f"MEMBER|{i.filename}|{i.file_size:,} bytes")
              # Summary TXT/MD and JSON are printed in full up to a strict cap.
              text_budget = 24_000
              for i in infos:
                  low = i.filename.lower()
                  if low.endswith((".txt", ".md", ".json")) and i.file_size <= 200_000 and text_budget > 0:
                      raw = z.read(i)
                      s = raw.decode("utf-8-sig", errors="replace")
                      if len(s) > min(10_000, text_budget):
                          s = s[:min(10_000, text_budget)] + "\n...[TRUNCATED]"
                      print(f"--- TEXT {i.filename} ---\n{s}")
                      text_budget -= len(s)
              # CSV schemas, row counts and small first-row samples; no massive data dump.
              csv_count = 0
              for i in infos:
                  if not i.filename.lower().endswith(".csv"):
                      continue
                  csv_count += 1
                  if csv_count > 16:
                      print("CSV member scan capped at 16 per archive.")
                      break
                  with z.open(i) as bf:
                      txt = io.TextIOWrapper(bf, encoding="utf-8-sig", errors="replace", newline="")
                      reader = csv.reader(txt)
                      try:
                          header = next(reader)
                      except StopIteration:
                          print(f"CSV|{i.filename}|EMPTY")
                          continue
                      sample = []
                      rows = 0
                      for row in reader:
                          rows += 1
                          if len(sample) < 3:
                              sample.append(row)
                      print(f"--- CSV {i.filename} ---")
                      print(f"rows={rows:,}; columns={len(header)}")
                      print("HEADER|" + "|".join(header[:80]))
                      for row in sample:
                          print("SAMPLE|" + "|".join(row[:30]))
          print(f"\nAUDIT_DONE downloaded_archives={len(files)}; bytes={done:,}")
          PY
