name: SSO Drive Read-only Sync Verification

on:
  push:
    branches:
      - "audit/sso-fugle-f04-actions-pilot_20261126"

permissions:
  contents: read

concurrency:
  group: sso-drive-readonly-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-drive-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
      SSO_BASE_FILE_ID: ${{ secrets.SSO_BASE_FILE_ID }}
      SSO_INCREMENT_FOLDER_ID: ${{ secrets.SSO_INCREMENT_FOLDER_ID }}
      FUGLE_API: ${{ secrets.FUGLE_API }}
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      OUTPUT_ROOT: /tmp/sso-drive-readonly-sync

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: actions/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r actions/requirements.txt

      - name: Download and verify Drive sources (read-only)
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"
          python actions/drive_sync.py --sync --output "$OUTPUT_ROOT"

      - name: Confirm no live market phase was started
        if: always()
        run: |
          echo "This workflow only downloads and hashes Drive source files."
          echo "It does not invoke Fugle, run F04 ranking, freeze Top10, or place orders."

      - name: Upload sync manifest only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sso-drive-readonly-sync-${{ github.run_id }}
          path: /tmp/sso-drive-readonly-sync/drive_sync_result.json
          if-no-files-found: ignore
          retention-days: 30
