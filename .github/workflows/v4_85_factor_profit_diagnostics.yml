name: SSO v4.85 factor-profit diagnostics archive reader

on:
  push:
    branches:
      - "audit/v4.84.9.3-rebuild-pipeline"
    paths:
      - "audit_uploads/v4.85_*/ZIP_PARTS_MANIFEST.json"

permissions:
  contents: write

concurrency:
  group: sso-v4-85-factor-profit-readout
  cancel-in-progress: false

jobs:
  read-audit-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: "audit/v4.84.9.3-rebuild-pipeline"
          persist-credentials: true

      - name: Verify, reassemble and extract full diagnostic tables
        run: |
          python - <<'PY'
          import csv, gzip, hashlib, io, json, zipfile
          from pathlib import Path

          manifests = sorted(
              Path("audit_uploads").glob("v4.85_*/ZIP_PARTS_MANIFEST.json"),
              key=lambda p: p.as_posix(), reverse=True
          )
          if not manifests:
              raise RuntimeError("No v4.85 ZIP_PARTS_MANIFEST.json found")
          manifest_path = manifests[0]
          manifest = json.loads(manifest_path.read_text(encoding="utf-8-sig"))
          readout = Path(manifest["readout_repo_path"])
          readout.mkdir(parents=True, exist_ok=True)
          full_tables = readout / "完整CSV報告"
          full_tables.mkdir(parents=True, exist_ok=True)
          archive = Path("/tmp/sso_v485_factor_profit_audit.zip")
          digest = hashlib.sha256()
          total = 0

          with archive.open("wb") as out:
              for part in manifest["parts"]:
                  p = Path(part["repo_path"])
                  data = p.read_bytes()
                  if len(data) != int(part["size_bytes"]):
                      raise RuntimeError("PART_SIZE_MISMATCH: " + str(p))
                  part_sha = hashlib.sha256(data).hexdigest()
                  if part_sha != part["sha256"]:
                      raise RuntimeError("PART_SHA256_MISMATCH: " + str(p))
                  out.write(data)
                  digest.update(data)
                  total += len(data)

          if total != int(manifest["zip_size_bytes"]):
              raise RuntimeError("ZIP_SIZE_MISMATCH")
          if digest.hexdigest() != manifest["zip_sha256"]:
              raise RuntimeError("ZIP_SHA256_MISMATCH")

          inventory, summaries, extracted = [], [], []
          full_extract_names = {
              "01_實際淨報酬空值總覽.csv",
              "02_實際淨報酬空值交叉分類.csv",
              "03_空值與原始交易狀態分布.csv",
              "04_H成本交易模式淨報酬可用率.csv",
              "05_24因子分層關聯IC與日市場IC.csv",
              "06_24因子分位組實際報酬.csv",
              "07_H成本交易模式分析母體.csv",
              "08_v470精確H標籤可用性.csv",
              "09_24因子訊號層級覆蓋與分布.csv"
          }

          with zipfile.ZipFile(archive, "r") as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError("ZIP_CRC_FAILED: " + str(bad))
              for info in zf.infolist():
                  name = info.filename
                  inventory.append({
                      "name": name,
                      "size_bytes": info.file_size,
                      "compressed_bytes": info.compress_size
                  })
                  base = Path(name).name
                  if base in full_extract_names:
                      target = full_tables / base
                      if name.lower().endswith(".csv.gz"):
                          with zf.open(name) as raw, gzip.GzipFile(fileobj=raw, mode="rb") as gz:
                              raw_csv = gz.read()
                      else:
                          raw_csv = zf.read(name)
                      target.write_bytes(raw_csv)
                      extracted.append({
                          "name": base,
                          "path": target.as_posix(),
                          "size_bytes": len(raw_csv),
                          "sha256": hashlib.sha256(raw_csv).hexdigest()
                      })

                  lower = name.lower()
                  rendered = ""
                  if lower.endswith(".csv.gz"):
                      with zf.open(name) as raw:
                          with gzip.GzipFile(fileobj=raw, mode="rb") as gz:
                              reader = csv.reader(io.TextIOWrapper(
                                  gz, encoding="utf-8-sig", errors="replace"
                              ))
                              rows = []
                              for i, row in enumerate(reader):
                                  rows.append(row)
                                  if i >= 10:
                                      break
                      rendered = "\n".join(" | ".join(row) for row in rows)
                  elif lower.endswith(".csv"):
                      with zf.open(name) as raw:
                          reader = csv.reader(io.TextIOWrapper(
                              raw, encoding="utf-8-sig", errors="replace"
                          ))
                          rendered = "\n".join(
                              " | ".join(row) for _, row in zip(range(30), reader)
                          )
                  elif lower.endswith(".json"):
                      rendered = json.dumps(
                          json.loads(zf.read(name).decode("utf-8-sig")),
                          ensure_ascii=False, indent=2
                      )
                  elif lower.endswith((".txt", ".md")):
                      rendered = zf.read(name).decode("utf-8-sig", errors="replace")
                  if rendered:
                      summaries.append(
                          "===== " + name + " =====\n" + rendered[:16000]
                      )

          payload = {
              "version": manifest.get("version", "v4.85"),
              "stamp": manifest.get("stamp", ""),
              "zip_crc": "PASS",
              "zip_size_bytes": total,
              "zip_sha256": digest.hexdigest(),
              "member_count": len(inventory),
              "inventory": inventory,
              "full_csv_extractions": extracted,
              "status": "READOUT_COMPLETED"
          }
          (readout / "00_Actions讀取摘要.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          (readout / "01_稽核ZIP內容摘要.txt").write_text(
              "\n\n".join(summaries), encoding="utf-8"
          )
          print("SSO_V4_85_READOUT_COMPLETED")
          print("SSO_V4_85_FULL_TABLES_EXTRACTED=" + str(len(extracted)))
          PY

      - name: Commit readout to isolated audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit_readout/
          if git diff --cached --quiet; then
            echo "No readout changes."
          else
            git commit -m "Add full SSO v4.85 factor diagnostic tables"
            git push origin "HEAD:refs/heads/audit/v4.84.9.3-rebuild-pipeline"
          fi
