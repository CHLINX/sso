name: Audit SSO temporal calibration and gate history
on:
  push:
    branches:
      - "audit/v4.85-calibration-evidence-20261103"
    paths:
      - ".github/workflows/audit_v485_temporal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporal-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Verify and analyze recent calibration windows
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, io, json, math, time, urllib.parse, urllib.request, zipfile
          from collections import defaultdict, Counter

          REPO="CHLINX/sso"
          ARCHIVES=[
              ("v2.48.1","SSO_v2.48.1_樣本外校準門檻與公司名稱結果.zip",21010200,"a100ed331990bb82940adcb71a1bbb7cc78acc5e"),
              ("v2.50","SSO_v2.50_日成交量特徵與500日檢查點結果.zip",21654521,"2ae5b146d767c5f54310ca7d53d986f56ae1c56f"),
              ("v2.51_individual","SSO_v2.51_個股獨立評估_量能消融與配對比較結果.zip",23606997,"d5196aeed4bffe6386dd456fce46be9338c60a51"),
              ("v2.51_ablation","SSO_v2.51_量能消融_停用量能特徵與配對比較結果.zip",21011289,"103335910c03a9a30099715b4362fed5672d0cd3"),
          ]

          def blob_sha(data):
              return hashlib.sha1(b"blob "+str(len(data)).encode()+bytes([0])+data).hexdigest()
          def num(v):
              try:
                  if v is None or str(v).strip()=="": return None
                  x=float(str(v).replace("%","").replace(",",""))
                  return x if math.isfinite(x) else None
              except Exception: return None
          def flag(v):
              if v is None: return None
              s=str(v).strip().lower()
              if s in ("true","1","yes","y","是","通過"): return True
              if s in ("false","0","no","n","否","未通過"): return False
              return None

          def read_csv(zf,name,archive,kind):
              raw=zf.open(name)
              text=io.TextIOWrapper(raw,encoding="utf-8-sig",errors="replace",newline="")
              reader=csv.DictReader(text)
              rows=[]
              start=time.time(); count=0; last=start
              for row in reader:
                  count+=1; rows.append(row)
                  if count%100000==0 or time.time()-last>=8:
                      elapsed=max(time.time()-start,1e-6)
                      print(f"PROGRESS {archive}/{kind}: rows={count:,}; bytes={raw.tell():,}/{zf.getinfo(name).file_size:,}; speed={count/elapsed:,.0f} rows/s",flush=True)
                      last=time.time()
              text.close()
              elapsed=max(time.time()-start,1e-6)
              print(f"SCAN_DONE {archive}/{kind}: rows={count:,}; bytes={zf.getinfo(name).file_size:,}; speed={count/elapsed:,.0f} rows/s",flush=True)
              return rows

          for ai,(label,filename,expected_size,expected_blob) in enumerate(ARCHIVES,1):
              print(f"\\n===== {label} {ai}/{len(ARCHIVES)} =====",flush=True)
              url=f"https://raw.githubusercontent.com/{REPO}/main/{urllib.parse.quote(filename)}"
              req=urllib.request.Request(url,headers={"User-Agent":"SSO-temporal-calibration-audit"})
              parts=[]; size=0; t0=time.time()
              with urllib.request.urlopen(req,timeout=120) as response:
                  while True:
                      b=response.read(1024*1024)
                      if not b: break
                      parts.append(b); size+=len(b)
                      print(f"DOWNLOAD {label}: {size:,}/{expected_size:,} ({size/expected_size:.1%})",flush=True)
              data=b"".join(parts)
              actual=blob_sha(data)
              if size!=expected_size or actual!=expected_blob: raise RuntimeError(f"Integrity mismatch {label}")
              print(f"INTEGRITY_OK {label} SHA256={hashlib.sha256(data).hexdigest()}",flush=True)
              with zipfile.ZipFile(io.BytesIO(data)) as zf:
                  if zf.testzip(): raise RuntimeError(f"CRC fail {label}")
                  calname=next(n for n in zf.namelist() if n.rsplit("/",1)[-1].startswith("獲利機率校準逐訊號日") and n.endswith(".csv"))
                  gatename=next(n for n in zf.namelist() if n.rsplit("/",1)[-1].startswith("樣本外機率區間門檻診斷") and n.endswith(".csv"))
                  calrows=read_csv(zf,calname,label,"calibration_daily")
                  maxidx=defaultdict(lambda:-1)
                  for r in calrows:
                      h=str(r.get("持有期間H",""))
                      idx=int(num(r.get("訊號全市場日序")) or -1)
                      maxidx[h]=max(maxidx[h],idx)
                  for window in (20,60):
                      agg=defaultdict(lambda:{"n":0,"wins":0,"pred_sum":0.0,"net_sum":0.0,"days":set()})
                      for r in calrows:
                          h=str(r.get("持有期間H","")); idx=int(num(r.get("訊號全市場日序")) or -1)
                          if idx < maxidx[h]-(window-1): continue
                          bucket=str(r.get("估計淨獲利機率區間",""))
                          n=int(num(r.get("有效樣本數")) or 0)
                          g=agg[(h,bucket)]
                          g["n"]+=n; g["wins"]+=int(num(r.get("淨獲利筆數")) or 0)
                          p=num(r.get("平均估計淨獲利機率"))
                          net=num(r.get("平均實際淨報酬"))
                          if p is not None: g["pred_sum"]+=p*n
                          if net is not None: g["net_sum"]+=net*n
                          if r.get("訊號日期"): g["days"].add(r["訊號日期"])
                      out=[]
                      for (h,b),g in sorted(agg.items()):
                          if b not in ("50-55%","55-60%","60-65%","65-70%",">=70%"): continue
                          n=g["n"]
                          out.append({"H":h,"bin":b,"n":n,"days":len(g["days"]),
                                      "actual_win":g["wins"]/n if n else None,
                                      "predicted":g["pred_sum"]/n if n else None,
                                      "mean_net":g["net_sum"]/n if n else None})
                      print(f"RECENT_{window}_SIGNAL_DAYS "+json.dumps({"archive":label,"bins":out},ensure_ascii=False),flush=True)

                  gaterows=read_csv(zf,gatename,label,"oos_gate_history")
                  summary=defaultdict(lambda:{"snapshots":0,"passed":0,"failed":0,"first_pass":"","last_pass":"","last_date":"","last_idx":-1,"last_n":0,"last_days":0,"last_weighted_win":None,"last_daily_win":None,"last_weighted_net":None,"last_daily_net":None})
                  for r in gaterows:
                      h=str(r.get("持有期間H","")); bucket=str(r.get("機率區間","")); key=(h,bucket)
                      s=summary[key]; s["snapshots"]+=1
                      passed=flag(r.get("歷史同機率區間通過門檻"))
                      if passed is True:
                          s["passed"]+=1
                          d=str(r.get("篩選基準訊號日期",""))
                          if not s["first_pass"]: s["first_pass"]=d
                          s["last_pass"]=d
                      else: s["failed"]+=1
                      idx=int(num(r.get("篩選基準全市場日序")) or -1)
                      if idx>=s["last_idx"]:
                          s["last_idx"]=idx; s["last_date"]=str(r.get("篩選基準訊號日期",""))
                          s["last_n"]=int(num(r.get("歷史同機率區間樣本數")) or 0)
                          s["last_days"]=int(num(r.get("歷史同機率區間訊號日數")) or 0)
                          s["last_weighted_win"]=num(r.get("歷史同區間實際淨獲利率_成交加權"))
                          s["last_daily_win"]=num(r.get("歷史同區間實際淨獲利率_逐日平均"))
                          s["last_weighted_net"]=num(r.get("歷史同區間平均實際淨報酬_成交加權"))
                          s["last_daily_net"]=num(r.get("歷史同區間平均實際淨報酬_逐日平均"))
                  compact={}
                  for (h,b),s in sorted(summary.items()):
                      if b not in ("50-55%","55-60%","60-65%","65-70%",">=70%"): continue
                      compact[f"{h}|{b}"]=s
                  print("OOS_GATE_FULL_HISTORY "+json.dumps({"archive":label,"gate_rows":len(gaterows),"bins":compact},ensure_ascii=False),flush=True)
              print(f"ARCHIVE_DONE {label}",flush=True)
          print("TEMPORAL_CALIBRATION_AUDIT_COMPLETE",flush=True)
          PY
